<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>The Honest Conversation</title>
<style>
:root{--bg:#f7f1ee;--ink:#302524;--muted:#756664;--rose:#9e4f54;--card:#fffdfb;--line:#eadbd6;--soft:#f6e9e6;--green:#4f7d6b;--gold:#8b6815}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#fff8f4 0,#f7f1ee 46%,#efe6e3 100%);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:1080px;margin:auto;padding:28px 18px 60px}.card{background:rgba(255,253,251,.97);border:1px solid var(--line);border-radius:24px;box-shadow:0 16px 50px rgba(74,43,40,.08)}.top{padding:28px 30px;display:flex;gap:24px;justify-content:space-between;align-items:center}.top h1,.section h2,.hero h1,.admin h2{font-family:Georgia,serif;color:#4a3030}.top h1{font-size:38px;margin:8px 0}.top p{margin:0;max-width:700px;color:var(--muted);line-height:1.5}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:12px;font-weight:800;color:var(--rose)}.progress{display:grid;grid-template-columns:auto auto;gap:4px 10px;min-width:190px;background:var(--soft);padding:18px;border-radius:18px}.progress strong{font-size:22px;color:var(--rose)}.progress span{font-size:12px;color:var(--muted);align-self:center}.tabs{display:flex;gap:8px;overflow:auto;padding:16px 0 12px}.tabs button{white-space:nowrap;border:1px solid var(--line);background:#fffaf8;padding:10px 13px;border-radius:999px;cursor:pointer;color:var(--muted)}.tabs button.active{background:var(--rose);color:#fff;border-color:var(--rose)}.section,.admin{padding:30px}.section-title{display:flex;gap:16px;border-bottom:1px solid var(--line);padding-bottom:22px}.section-title .emoji{font-size:34px}.section h2{font-size:32px;margin:0 0 8px}.section-title p{margin:0;color:var(--muted)}.question{padding:26px 0;border-bottom:1px solid var(--line)}.qhead{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:start}.number{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-weight:800;color:var(--rose)}.qhead h3{font-family:Georgia,serif;font-size:21px;line-height:1.45;margin:2px 0 14px}.badge{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;background:#eee5e2;color:#7b6a67;padding:7px 9px;border-radius:999px}.badge.waiting{background:#fff2cf;color:var(--gold)}.badge.done{background:#e1f0e9;color:#376653}label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--muted);margin:10px 0 8px}textarea,input,select{width:100%;border:1px solid #dbc9c4;border-radius:14px;padding:12px;font:inherit;background:#fff;color:var(--ink)}textarea{min-height:126px;resize:vertical;line-height:1.5}.actions{display:flex;align-items:center;gap:13px;margin:10px 0 16px;flex-wrap:wrap}button.primary,.pager button,.admin-actions button{border:0;background:var(--rose);color:#fff;font-weight:800;padding:11px 16px;border-radius:12px;cursor:pointer}button.secondary{border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700;padding:10px 14px;border-radius:12px;cursor:pointer}button:disabled{opacity:.45}.saved{font-size:13px;color:var(--green);font-weight:700}.partner{background:#f2ecea;border:1px dashed #d3c4c0;border-radius:16px;padding:16px}.partner.revealed{background:#edf5f1;border-style:solid;border-color:#c9ded4}.partner-title{font-weight:800;margin-bottom:7px}.partner p{margin:0;white-space:pre-wrap;line-height:1.55}.locked{color:var(--muted)}.pager{display:flex;justify-content:space-between;align-items:center;padding-top:26px}.toast{position:fixed;bottom:20px;right:20px;max-width:380px;background:#fff3d9;border:1px solid #ecd39d;padding:12px 15px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.12);z-index:20}footer{text-align:center;color:var(--muted);font-size:13px;padding:26px}.loading{text-align:center;padding:60px}.pulse{font-size:48px;color:var(--rose)}.hero{max-width:780px;margin:8vh auto;padding:50px}.hero h1{font-size:clamp(40px,7vw,68px);line-height:1;margin:12px 0 20px}.lead{font-size:20px;line-height:1.6}.history{display:inline-block;margin:18px 0;padding:10px 15px;background:var(--soft);border-radius:999px;color:#6b4547;font-weight:700}.small{color:var(--muted)}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.admin-form{padding:20px;background:var(--soft);border-radius:18px;margin:20px 0}.admin-q{border-top:1px solid var(--line);padding:16px 0}.admin-q.inactive{opacity:.55}.admin-q .meta{font-size:12px;color:var(--muted);margin-bottom:6px}.admin-actions{display:flex;gap:8px;flex-wrap:wrap}.error{background:#fee9e7;border:1px solid #efb7b1;padding:12px 14px;border-radius:14px;color:#7e302a}@media(max-width:720px){.top{align-items:flex-start;flex-direction:column}.progress{width:100%}.section,.admin{padding:20px}.qhead{grid-template-columns:34px 1fr}.badge{grid-column:2;justify-self:start}.admin-grid{grid-template-columns:1fr}}
</style>
</head>
<body><main id="app" class="shell"><div class="card loading"><div class="pulse">♥</div><p>Opening your private conversation…</p></div></main>
<script>
const API='https://qarhqzddzoohftwpzkbb.supabase.co/functions/v1/honest-conversation-api';
const token=new URLSearchParams(location.search).get('t')||'';
let data=null,activeSection=0,drafts={};
const meta={'What We Feel Now':['❤️','Start with what is still here after all these years — without letting nostalgia answer for you.'],'The Past, the Hurt, and Our Patterns':['💔','About eight years together and another decade of finding your way back to each other means there is history worth facing clearly.'],'Fear and Vulnerability':['🥺','Answer what is difficult to say out loud.'],'Our Current Relationships':['💍','Be truthful before making decisions that affect other people.'],'Would This Really Be Different?':['🌱','Love matters, but a different outcome usually requires different behavior.'],'At the Heart of It':['🔥','Separate chemistry and history from the life you could actually build now.'],'The Question That Matters Most':['✨','Answer this one slowly.']};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function toast(msg){let e=document.createElement('div');e.className='toast';e.textContent=msg;document.body.appendChild(e);setTimeout(()=>e.remove(),2500)}
async function request(method='GET',body){let u=API+(method==='GET'?('?token='+encodeURIComponent(token)):'');let r=await fetch(u,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify({...body,token}):undefined});let j=await r.json().catch(()=>({error:'Unexpected response.'}));if(!r.ok)throw new Error(j.error||'Request failed.');return j}
async function load(){if(!token){landing('This page needs its private link.');return}try{data=await request();if(data.session.role==='admin')renderAdmin();else{for(const q of data.questions)drafts[q.id]=q.own_answer||'';renderParticipant()}}catch(e){landing(e.message)}}
function landing(msg=''){document.getElementById('app').innerHTML='<section class="hero card"><div class="eyebrow">A private two-person conversation</div><h1>The Honest Conversation</h1><p class="lead">Two people. Two honest answers. Neither person sees the other’s answer until they have answered the same question themselves.</p><div class="history">18 years of history · about 8 years together · 10 years of finding your way back to each other</div>'+(msg?'<div class="error">'+esc(msg)+'</div>':'')+'<p class="small">Open the private link created specifically for you to begin.</p></section>'}
function groups(){let m=new Map();for(const q of data.questions){if(!m.has(q.section))m.set(q.section,[]);m.get(q.section).push(q)}return [...m.entries()]}
function renderParticipant(){const gs=groups();if(activeSection>=gs.length)activeSection=0;const [section,qs]=gs[activeSection];const answered=data.questions.filter(q=>q.own_answer).length,both=data.questions.filter(q=>q.partner_answer).length;let h='<header class="top card"><div><div class="eyebrow">The Honest Conversation</div><h1>Your private answers</h1><p>Answer for yourself first. The other person’s response unlocks only after you answer the same question.</p></div><div class="progress"><strong>'+answered+'/'+data.questions.length+'</strong><span>you answered</span><strong>'+both+'</strong><span>mutually revealed</span></div></header><nav class="tabs">';gs.forEach(([s],i)=>h+='<button data-tab="'+i+'" class="'+(i===activeSection?'active':'')+'">'+((meta[s]||['•'])[0])+' '+esc(s)+'</button>');h+='</nav><section class="section card"><div class="section-title"><span class="emoji">'+((meta[section]||['💬'])[0])+'</span><div><h2>'+esc(section)+'</h2><p>'+esc((meta[section]||['','Take your time and answer honestly.'])[1])+'</p></div></div>';
qs.forEach(q=>{const n=data.questions.findIndex(x=>x.id===q.id)+1,status=q.partner_answer?'Both answered':q.own_answer?'Waiting for them':'Not answered';h+='<article class="question"><div class="qhead"><span class="number">'+n+'</span><h3>'+esc(q.prompt)+'</h3><span class="badge '+(q.partner_answer?'done':q.own_answer?'waiting':'')+'">'+status+'</span></div><label>Your answer</label><textarea data-draft="'+q.id+'" placeholder="Say what is true for you — not what you think they want to hear.">'+esc(drafts[q.id]||'')+'</textarea><div class="actions"><button class="primary" data-save="'+q.id+'">Save my answer</button>'+(q.own_answer?'<span class="saved">✓ Your answer is saved</span>':'')+'</div><div class="partner '+(q.partner_answer?'revealed':'')+'"><div class="partner-title">Their answer</div>'+(q.partner_answer?'<p>'+esc(q.partner_answer).replace(/\n/g,'<br>')+'</p>':'<p class="locked">🔒 Hidden until both of you answer this question.</p>')+'</div></article>'});h+='<div class="pager"><button id="prev" '+(activeSection===0?'disabled':'')+'>← Previous</button><span>'+(activeSection+1)+' of '+gs.length+'</span><button id="next" '+(activeSection===gs.length-1?'disabled':'')+'>Next →</button></div></section><footer>Private by design. No answer is revealed before you give your own.</footer>';document.getElementById('app').innerHTML=h;bindParticipant()}
function bindParticipant(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{capture();activeSection=Number(b.dataset.tab);renderParticipant();scrollTo(0,0)});document.querySelectorAll('[data-draft]').forEach(t=>t.oninput=()=>drafts[t.dataset.draft]=t.value);document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{capture();let id=Number(b.dataset.save),answer=(drafts[id]||'').trim();if(!answer){toast('Write an answer first.');return}b.disabled=true;try{await request('POST',{action:'save_answer',question_id:id,answer});toast('Saved privately.');data=await request();renderParticipant()}catch(e){toast(e.message);b.disabled=false}});let p=document.getElementById('prev'),n=document.getElementById('next');if(p)p.onclick=()=>{capture();activeSection--;renderParticipant();scrollTo(0,0)};if(n)n.onclick=()=>{capture();activeSection++;renderParticipant();scrollTo(0,0)}}
function capture(){document.querySelectorAll('[data-draft]').forEach(t=>drafts[t.dataset.draft]=t.value)}
function renderAdmin(){const qs=data.questions;const sections=[...new Map(qs.map(q=>[q.section,{section:q.section,order:q.section_order}])).values()].sort((a,b)=>a.order-b.order);let opts=sections.map(s=>'<option value="'+esc(s.section)+'">'+esc(s.section)+'</option>').join('');let h='<header class="top card"><div><div class="eyebrow">Private administration</div><h1>Question Manager</h1><p>Add, edit, reorder, deactivate, or reactivate questions without rebuilding the site.</p></div><div class="progress"><strong>'+qs.filter(q=>q.active).length+'</strong><span>active questions</span><strong>'+sections.length+'</strong><span>sections</span></div></header><section class="admin card"><h2>Add a question</h2><div class="admin-form"><div class="admin-grid"><div><label>Section</label><select id="addSection">'+opts+'</select></div><div><label>Order</label><input id="addOrder" type="number" min="1" placeholder="Leave blank to add at end"></div></div><label>Question</label><textarea id="addPrompt"></textarea><div class="actions"><button class="primary" id="addBtn">Add question</button></div></div><h2>Existing questions</h2>';let last='';for(const q of qs){if(q.section!==last){h+='<h3>'+((meta[q.section]||['💬'])[0])+' '+esc(q.section)+'</h3>';last=q.section}h+='<div class="admin-q '+(q.active?'':'inactive')+'" data-row="'+q.id+'"><div class="meta">Section '+q.section_order+' · Question '+q.question_order+' · '+(q.active?'Active':'Inactive')+'</div><p>'+esc(q.prompt)+'</p><div class="admin-actions"><button data-edit="'+q.id+'">Edit</button><button class="secondary" data-toggle="'+q.id+'">'+(q.active?'Deactivate':'Reactivate')+'</button></div></div>'}h+='</section><footer>Keep this admin link private.</footer>';document.getElementById('app').innerHTML=h;bindAdmin(sections)}
function bindAdmin(sections){document.getElementById('addBtn').onclick=async()=>{let section=document.getElementById('addSection').value,prompt=document.getElementById('addPrompt').value.trim(),ord=document.getElementById('addOrder').value,s=sections.find(x=>x.section===section);if(!prompt){toast('Type the question first.');return}try{await request('POST',{action:'add_question',section,section_order:s.order,question_order:ord?Number(ord):0,prompt});data=await request();renderAdmin();toast('Question added.')}catch(e){toast(e.message)}};document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{let q=data.questions.find(x=>x.id===Number(b.dataset.toggle));try{await request('POST',{action:'update_question',id:q.id,section:q.section,section_order:q.section_order,question_order:q.question_order,prompt:q.prompt,active:!q.active});data=await request();renderAdmin()}catch(e){toast(e.message)}});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(Number(b.dataset.edit),sections))}
function edit(id,sections){let q=data.questions.find(x=>x.id===id),row=document.querySelector('[data-row="'+id+'"]');row.innerHTML='<label>Section</label><select id="es'+id+'">'+sections.map(s=>'<option value="'+esc(s.section)+'" '+(s.section===q.section?'selected':'')+'>'+esc(s.section)+'</option>').join('')+'</select><label>Order</label><input id="eo'+id+'" type="number" min="1" value="'+q.question_order+'"><label>Question</label><textarea id="ep'+id+'">'+esc(q.prompt)+'</textarea><div class="admin-actions"><button id="save'+id+'">Save changes</button><button class="secondary" id="cancel'+id+'">Cancel</button></div>';document.getElementById('cancel'+id).onclick=renderAdmin;document.getElementById('save'+id).onclick=async()=>{let section=document.getElementById('es'+id).value,prompt=document.getElementById('ep'+id).value.trim(),order=Number(document.getElementById('eo'+id).value),s=sections.find(x=>x.section===section);try{await request('POST',{action:'update_question',id:q.id,section,section_order:s.order,question_order:order,prompt,active:q.active});data=await request();renderAdmin();toast('Question updated.')}catch(e){toast(e.message)}}}
load();
</script></body></html>
