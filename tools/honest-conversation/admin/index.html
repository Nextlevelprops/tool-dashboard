<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Honest Conversation Admin</title><style>:root{--bg:#f7f1ee;--card:#fffdfb;--ink:#302524;--muted:#756664;--rose:#9e4f54;--line:#eadbd6;--soft:#f6e9e6;--danger:#8b2f2f}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fff8f4,#f4ece9);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}main{max-width:1180px;margin:auto;padding:28px 18px 60px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 40px rgba(74,43,40,.08)}header{padding:28px}.eyebrow{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--rose)}h1,h2,h3{font-family:Georgia,serif}h1{margin:7px 0 8px;font-size:42px}.muted{color:var(--muted)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer;background:var(--rose);color:#fff}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:var(--danger)}.section{margin-top:18px;padding:24px}.section h2{margin:0 0 18px;font-size:28px}.q{border-top:1px solid var(--line);padding:22px 0}.q:first-of-type{border-top:0}.qnum{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}.prompt{font-family:Georgia,serif;font-size:21px;line-height:1.4;margin:7px 0 14px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}.answer{background:var(--soft);border-radius:16px;padding:16px;min-height:110px}.answer h3{font-size:17px;margin:0 0 10px}.answer p{white-space:pre-wrap;line-height:1.55;margin:0}.empty{color:var(--muted);font-style:italic}.row-actions{margin-top:10px}.status{padding:14px 16px;margin-top:16px;border-radius:14px;background:#f2ecea}.error{background:#fee9e7;color:#7e302a}.success{background:#e8f4ed;color:#35624f}@media(max-width:720px){.answers{grid-template-columns:1fr}h1{font-size:34px}}</style></head><body><main><header class="card"><div class="eyebrow">Private administration</div><h1>James & Whitney — Responses</h1><p class="muted">This page keeps a permanent side-by-side view of both answers for every question. It does not change what James or Whitney can see on their own private links.</p><div class="toolbar"><button class="btn secondary" id="refresh">Refresh answers</button><button class="btn danger" id="clearAll">Clear all answers</button></div><div id="status" class="status">Loading…</div></header><div id="content"></div></main><script>const API='https://qarhqzddzoohftwpzkbb.supabase.co/functions/v1/honest-conversation-api';const token=new URLSearchParams(location.search).get('t')||'';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function req(method='GET',body){let u=API+(method==='GET'?('?token='+encodeURIComponent(token)):'');let r=await fetch(u,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify({...body,token}):undefined});let j=await r.json().catch(()=>({error:'Unexpected response.'}));if(!r.ok)throw new Error(j.error||'Request failed.');return j}function setStatus(t,kind=''){let e=document.getElementById('status');e.className='status '+kind;e.textContent=t}async function load(){if(!token){setStatus('This admin page needs the private admin link.','error');return}try{let d=await req();if(d.session.role!=='admin')throw new Error('Admin access required.');let groups=new Map();for(const q of d.questions){if(!groups.has(q.section))groups.set(q.section,[]);groups.get(q.section).push(q)}let n=0,h='';for(const [section,qs] of groups){h+='<section class="section card"><h2>'+esc(section)+'</h2>';for(const q of qs){n++;h+='<div class="q"><div class="qnum">Question '+n+'</div><div class="prompt">'+esc(q.prompt)+'</div><div class="answers"><div class="answer"><h3>James</h3>'+(q.james_answer?'<p>'+esc(q.james_answer)+'</p>':'<p class="empty">No answer yet.</p>')+'</div><div class="answer"><h3>Whitney</h3>'+(q.whitney_answer?'<p>'+esc(q.whitney_answer)+'</p>':'<p class="empty">No answer yet.</p>')+'</div></div><div class="row-actions"><button class="btn secondary" data-clear="'+q.id+'">Clear answers for this question</button></div></div>'}h+='</section>'}document.getElementById('content').innerHTML=h;document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=async()=>{if(!confirm('Clear both James and Whitney answers for this question?'))return;await req('POST',{action:'delete_question_answers',question_id:Number(b.dataset.clear)});setStatus('Those two answers were cleared.','success');load()});setStatus('Loaded '+d.questions.length+' questions.','success')}catch(e){setStatus(e.message,'error')}}document.getElementById('refresh').onclick=load;document.getElementById('clearAll').onclick=async()=>{if(!confirm('Clear ALL answers for James and Whitney? Questions will stay. This cannot be undone.'))return;try{let r=await req('POST',{action:'clear_all_answers'});setStatus('Cleared '+r.deleted+' saved answers.','success');load()}catch(e){setStatus(e.message,'error')}};load();</script></body></html>
